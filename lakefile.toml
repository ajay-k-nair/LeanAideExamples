name = "LeanAideExamples"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanAideExamples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
path = "/home/ajaynair/LeanAide/.lake/packages/mathlib"

[[require]]
name = "leanaidecore"
path = "/home/ajaynair/LeanAide/LeanAideCore"